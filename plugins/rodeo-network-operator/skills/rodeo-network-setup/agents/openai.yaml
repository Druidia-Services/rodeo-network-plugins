interface:
  display_name: "Rodeo Network setup"
  short_description: "Create the workspace and sign in to Rodeo Network"
  icon_small: "./assets/icon.svg"
  icon_large: "./assets/logo.png"
  brand_color: "#5B4A6B"
  default_prompt: "Use $rodeo-network-setup to set up Rodeo Network on this computer."

dependencies:
  tools:
    - type: "mcp"
      value: "rodeo_network_admin"
      description: "Rodeo Network full operator MCP server"
      transport: "streamable_http"
      url: "https://admin.prorodeos.org/api/mcp"
